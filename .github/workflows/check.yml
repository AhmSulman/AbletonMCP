name: check

on: [push, pull_request]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP server dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -q mcp_server.py drum_patterns.py AbletonMCP
      - name: Import MCP server and pattern library
        run: python -c "import asyncio, drum_patterns, mcp_server; print(len(asyncio.run(mcp_server.list_tools())), 'tools')"
